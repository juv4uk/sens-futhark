name: futhark-smoke

on:
  pull_request:
  workflow_dispatch:

# One physical GPU backs this repository. Prefer the newest request rather than
# spending the GPU lane on obsolete revisions.
concurrency:
  group: sens-futhark-gpu
  cancel-in-progress: true

jobs:
  witness:
    runs-on: [self-hosted, Linux, X64, sens-futhark]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Futhark
        run: make bootstrap
      - name: Check infrastructure smoke
        run: make check
      - name: Check exact-identity witness source
        run: make check-identity
      - name: Run exact-identity witness on CPU
        run: make test-identity-cpu
      - name: Run exact-identity witness on CUDA
        run: make test-identity-cuda
      - name: Check packed-domain kernel
        run: make check-packed-domain
      - name: Run packed-domain kernel on CPU and CUDA
        run: make test-packed-domain
