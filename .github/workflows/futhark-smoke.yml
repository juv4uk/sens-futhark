name: futhark-smoke

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Futhark
        run: make bootstrap
      - name: Check Futhark source
        run: make check
