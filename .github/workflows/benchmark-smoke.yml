name: benchmark

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: Comma-separated batch sizes
        required: true
        default: "1048576,2097152,4194304,8388608"
        type: string
      runs:
        description: Futhark bench sampling interval
        required: true
        default: "5"
        type: string
      cold_runs:
        description: Cold process launches per backend
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64, sens-futhark]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Futhark
        run: make bootstrap

      - name: Check benchmark harness
        run: |
          python3 -m py_compile bench/run.py
          python3 -m py_compile bench/summarize.py

      - name: Run benchmark
        env:
          FUTHARK: ${{ github.workspace }}/.tools/bin/futhark
          CUDA_HOME: /usr/local/cuda-12.6
        run: |
          python3 bench/run.py \
            --sizes "${{ inputs.sizes }}" \
            --runs "${{ inputs.runs }}" \
            --cold-runs "${{ inputs.cold_runs }}" \
            --out bench/results/run
          python3 bench/summarize.py bench/results/run | tee bench/results/run/summary.txt

      - name: Show benchmark summary
        if: always()
        run: |
          for f in metadata.json summary.json summary.txt; do
            if [ -f "bench/results/run/$f" ]; then
              echo "===== $f ====="
              cat "bench/results/run/$f"
            fi
          done

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sens-futhark-benchmark-${{ github.sha }}
          path: bench/results/run
          if-no-files-found: error
