name: cpu-witness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-reference:
    name: CPU reference witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: python3 host/cpu_witness.py --self-test

      - name: Positive corpus (must accept all)
        id: positive
        run: |
          set -euo pipefail
          out=$(python3 host/cpu_witness.py --fixture tests/identity_vectors.csv)
          echo "$out"
          digest=$(echo "$out" | sed -n 's/.*(sha256 \([0-9a-f]*\)).*/\1/p')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### CPU witness digest" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Negative corpus (must fail closed)
        run: |
          set +e
          out=$(python3 host/cpu_witness.py --fixture tests/identity_invalid_vectors.csv 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "expected non-zero exit on invalid corpus" >&2
            exit 1
          fi
          rejects=$(echo "$out" | sed -n 's/.*(rejects \([0-9]*\)).*/\1/p' | tail -1)
          echo "rejects=$rejects"
          if [ "$rejects" != "6" ]; then
            echo "expected 6 rejects, got ${rejects:-none}" >&2
            exit 1
          fi
