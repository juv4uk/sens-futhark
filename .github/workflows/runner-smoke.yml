name: runner-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64, sens-futhark]
    timeout-minutes: 5
    steps:
      - name: Runner identity
        run: |
          echo "runner=$RUNNER_NAME"
          echo "os=$RUNNER_OS"
          uname -a
          nvidia-smi -L || true
