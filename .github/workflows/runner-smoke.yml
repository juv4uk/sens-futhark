name: runner-smoke

on:
  push:
    branches:
      - agent/chatgpt-sol/1-futhark-toolchain
  workflow_dispatch:

jobs:
  gpu-smoke:
    runs-on: [self-hosted, Linux, X64, sens-futhark]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Runner identity
        run: |
          echo "runner=$RUNNER_NAME"
          echo "os=$RUNNER_OS"
          uname -a

      - name: Ensure OpenCL build dependencies
        run: |
          if [ ! -f /usr/include/CL/cl.h ] || ! command -v clinfo >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y ocl-icd-opencl-dev clinfo
          fi
          test -f /usr/include/CL/cl.h
          clinfo -l || true

      - name: Bootstrap pinned Futhark
        run: make bootstrap

      - name: Probe GPU and OpenCL
        run: make probe

      - name: Compile and execute OpenCL smoke
        run: make smoke-opencl
