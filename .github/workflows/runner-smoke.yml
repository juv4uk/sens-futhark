name: runner-smoke

on:
  push:
    branches:
      - agent/chatgpt-sol/1-futhark-toolchain
  workflow_dispatch:

jobs:
  gpu-smoke:
    runs-on: [self-hosted, Linux, X64, sens-futhark]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Runner identity
        run: |
          echo "runner=$RUNNER_NAME"
          echo "os=$RUNNER_OS"
          uname -a

      - name: Verify OpenCL build dependencies
        run: |
          test -f /usr/include/CL/cl.h
          command -v clinfo
          clinfo -l || true

      - name: Bootstrap pinned Futhark
        run: make bootstrap

      - name: Probe GPU and OpenCL
        run: make probe

      - name: OpenCL runtime probe
        continue-on-error: true
        run: make smoke-opencl

      - name: CUDA GPU smoke
        run: make smoke-cuda
