name: Futhark witnesses

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gpu:
        description: Run the CUDA witness on the self-hosted GPU runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sens-futhark-witness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-check:
    name: Futhark CPU source check
    runs-on: [self-hosted, Linux, X64, sens-futhark]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Futhark
        run: make bootstrap
      - name: Verify pinned version
        run: .tools/bin/futhark --version | grep -F "$(sed -n 's/^FUTHARK_VERSION=//p' toolchain/futhark.env)"
      - name: Check sources
        run: |
          make check
          make check-identity
          make check-packed-domain

  cpu-witness:
    name: Futhark CPU witness
    runs-on: [self-hosted, Linux, X64, sens-futhark]
    needs: cpu-check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Futhark
        run: make bootstrap
      - name: Run CPU witnesses
        run: |
          make test-identity-cpu
          .tools/bin/futhark test --backend=c futhark/packed_domain.fut
      - name: Publish CPU evidence metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/futhark
          version="$(sed -n 's/^FUTHARK_VERSION=//p' toolchain/futhark.env)"
          sha256="$(sed -n 's/^FUTHARK_ARCHIVE_SHA256=//p' toolchain/futhark.env)"
          {
            echo "repository_sha=$GITHUB_SHA"
            echo "futhark_version=$version"
            echo "futhark_sha256=$sha256"
            echo "backend=c"
            echo "runner=$RUNNER_NAME"
          } > evidence/futhark/cpu.env
      - uses: actions/upload-artifact@v4
        with:
          name: futhark-cpu-evidence-${{ github.sha }}
          path: evidence/futhark/cpu.env

  cuda:
    name: Futhark CUDA witness
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu == true }}
    runs-on: [self-hosted, Linux, X64, sens-futhark]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Futhark
        run: make bootstrap
      - name: Verify CUDA host contract
        run: make probe-cuda-json
      - name: Run CUDA witnesses
        run: |
          make test-identity-cuda
          make test-packed-domain
      - name: Publish CUDA evidence metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/futhark
          version="$(sed -n 's/^FUTHARK_VERSION=//p' toolchain/futhark.env)"
          sha256="$(sed -n 's/^FUTHARK_ARCHIVE_SHA256=//p' toolchain/futhark.env)"
          {
            echo "repository_sha=$GITHUB_SHA"
            echo "futhark_version=$version"
            echo "futhark_sha256=$sha256"
            echo "backend=cuda"
            echo "runner=$RUNNER_NAME"
          } > evidence/futhark/cuda.env
      - uses: actions/upload-artifact@v4
        with:
          name: futhark-cuda-evidence-${{ github.sha }}
          path: evidence/futhark/cuda.env
