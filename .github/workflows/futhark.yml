name: GPU-only CUDA witnesses

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest GPU request for a ref may occupy the single physical card.
concurrency:
  group: sens-futhark-gpu-only
  cancel-in-progress: true

jobs:
  cuda:
    name: CUDA-only witness
    # Fail closed onto the GPU-capable runner. Never fall back to an ordinary CPU runner.
    runs-on: [self-hosted, Linux, X64, gpu, cuda-12.6, sens-futhark]
    timeout-minutes: 15
    env:
      # Cargo is bootstrap/control-plane only; do not let it saturate the host CPU.
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Host-control step only: prepares the compiler used to launch CUDA work.
      - name: Install pinned Futhark
        run: make bootstrap

      - name: Prove CUDA device contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/futhark
          make probe-cuda-json | tee evidence/futhark/cuda-capability.json

      - name: Run CUDA-only workloads through CML admission
        shell: bash
        env:
          CML_GPU_ADMISSION_LOCK: /run/cml-gpu-worker/gpu-admission.lock
        run: |
          set -euo pipefail
          command -v flock >/dev/null 2>&1 || {
            echo "ERROR: flock is required for shared CML GPU admission" >&2
            exit 2
          }
          lock="$CML_GPU_ADMISSION_LOCK"
          request_ns="$(date +%s%N)"
          mkdir -p "$(dirname "$lock")"
          export ADMISSION_LOCK="$lock"
          export REQUEST_NS="$request_ns"

          flock -x -w 780 "$lock" bash -c '
            set -euo pipefail
            acquired_ns="$(date +%s%N)"
            wait_ns="$((acquired_ns - REQUEST_NS))"
            owner="${ADMISSION_LOCK}.owner"
            printf "repository=%s\nrun_id=%s\njob=%s\ncase_id=%s\nresource_key=%s\nadmission_wait_ns=%s\n" \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "cuda-only-witness" "futhark-cuda" \
              "${CML_GPU_RESOURCE_KEY:-cuda:0}" "$wait_ns" > "$owner"
            trap "rm -f \"$owner\"" EXIT HUP INT TERM

            {
              echo "repository=$GITHUB_REPOSITORY"
              echo "run_id=$GITHUB_RUN_ID"
              echo "job=cuda-only-witness"
              echo "case_id=futhark-cuda"
              echo "resource_key=${CML_GPU_RESOURCE_KEY:-cuda:0}"
              echo "admission_lock=$ADMISSION_LOCK"
              echo "admission_wait_ns=$wait_ns"
            } > evidence/futhark/admission.env

            make smoke-cuda
            make test-identity-cuda
            make test-packed-domain-cuda
            make test-compiler-backend-cuda
          '

      - name: Publish CUDA evidence metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^FUTHARK_VERSION=//p' toolchain/futhark.env)"
          sha256="$(sed -n 's/^FUTHARK_ARCHIVE_SHA256=//p' toolchain/futhark.env)"
          {
            echo "repository_sha=$GITHUB_SHA"
            echo "futhark_version=$version"
            echo "futhark_sha256=$sha256"
            echo "backend=cuda"
            echo "runner=$RUNNER_NAME"
            echo "policy=gpu-only"
          } > evidence/futhark/cuda.env

      - uses: actions/upload-artifact@v4
        with:
          name: futhark-cuda-evidence-${{ github.sha }}
          path: |
            evidence/futhark/cuda.env
            evidence/futhark/cuda-capability.json
            evidence/futhark/admission.env
